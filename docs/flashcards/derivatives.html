<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CFA Derivatives Flashcards</title>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, Helvetica, sans-serif;
    }

    body{
      background:#f3f4f6;
      display:flex;
      justify-content:center;
      align-items:center;
      min-height:100vh;
      padding:20px;
    }

    .flashcard-container{
      width:700px;
      max-width:95%;
    }

    .card{
      width:100%;
      height:380px;
      perspective:1000px;
      cursor:pointer;
    }

    .card-inner{
      position:relative;
      width:100%;
      height:100%;
      transition:transform 0.6s;
      transform-style:preserve-3d;
    }

    .card.flipped .card-inner{
      transform:rotateY(180deg);
    }

    .card-front,
    .card-back{
      position:absolute;
      width:100%;
      height:100%;
      border-radius:24px;
      padding:40px;

      display:flex;
      flex-direction:column;
      justify-content:center;
      align-items:center;
      text-align:center;

      backface-visibility:hidden;

      box-shadow:0 10px 30px rgba(0,0,0,0.08);
    }

    .card-front{
      background:white;
      color:#111827;
    }

    .card-back{
      background:#2563eb;
      color:white;
      transform:rotateY(180deg);
    }

    .tag{
      padding:10px 24px;
      border-radius:999px;
      font-size:14px;
      font-weight:bold;
      margin-bottom:28px;
    }

    .front-tag{
      background:#dbeafe;
      color:#2563eb;
    }

    .back-tag{
      background:white;
      color:#2563eb;
    }

    h2{
      font-size:34px;
      line-height:1.5;
      max-width:95%;
    }

    .hint{
      margin-top:30px;
      font-size:14px;
      opacity:0.7;
    }

    .controls{
      margin-top:30px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:15px;
      flex-wrap:wrap;
    }

    button{
      border:none;
      background:#2563eb;
      color:white;
      padding:15px 26px;
      border-radius:14px;
      cursor:pointer;
      font-size:18px;
      font-weight:600;
      transition:0.2s;
    }

    button:hover{
      background:#1d4ed8;
    }

    .counter{
      font-size:28px;
      font-weight:bold;
      color:#374151;
    }

    @media(max-width:600px){

      .card{
        height:430px;
      }

      h2{
        font-size:26px;
      }

      .counter{
        font-size:22px;
      }

      button{
        width:100%;
      }

      .controls{
        flex-direction:column;
      }

    }

  </style>

</head>
<body>

  <div class="flashcard-container">

    <div class="card" id="flashcard">

      <div class="card-inner">

        <div class="card-front">

          <div class="tag front-tag">
            DERIVATIVES QUESTION
          </div>

          <h2 id="question"></h2>

          <div class="hint">
            Click card to flip
          </div>

        </div>

        <div class="card-back">

          <div class="tag back-tag">
            ANSWER
          </div>

          <h2 id="answer"></h2>

        </div>

      </div>

    </div>

    <div class="controls">

      <button onclick="prevCard()">
        ← Previous
      </button>

      <div class="counter" id="counter">
        1 / 20
      </div>

      <button onclick="nextCard()">
        Next →
      </button>

    </div>

  </div>

  <script>

    const flashcards = [

      {
        question: "What are derivatives?",
        answer: "Financial instruments whose value depends on an underlying asset."
      },

      {
        question: "What are OTC derivatives?",
        answer: "Customized contracts traded privately between parties."
      },

      {
        question: "What are Exchange-Traded Derivatives (ETD)?",
        answer: "Standardized derivative contracts traded on formal exchanges."
      },

      {
        question: "What is counterparty risk?",
        answer: "Risk that the other party may fail to meet obligations."
      },

      {
        question: "What is central clearing?",
        answer: "A CCP stands between buyers and sellers to reduce risk."
      },

      {
        question: "Examples of derivative underlyings?",
        answer: "Equities, bonds, currencies, commodities, credit, and crypto."
      },

      {
        question: "What are forwards?",
        answer: "Customized contracts to buy or sell assets in the future."
      },

      {
        question: "What are futures?",
        answer: "Standardized forward contracts traded on exchanges."
      },

      {
        question: "What are options?",
        answer: "Contracts giving the right but not obligation to trade assets."
      },

      {
        question: "What is open interest?",
        answer: "Total outstanding derivative contracts not yet closed."
      },

      {
        question: "What are swaps?",
        answer: "Contracts where parties exchange future cash flows."
      },

      {
        question: "What is intrinsic value of an option?",
        answer: "Immediate exercise value of the option."
      },

      {
        question: "What is arbitrage?",
        answer: "Risk-free profit from price differences in markets."
      },

      {
        question: "What is replication?",
        answer: "Creating derivative cash flows using underlying assets and borrowing/lending."
      },

      {
        question: "What is cost of carry?",
        answer: "Net cost or benefit of holding an asset over time."
      },

      {
        question: "What is a forward contract value?",
        answer: "Difference between market forward price and contract price."
      },

      {
        question: "What is mark-to-market in futures?",
        answer: "Daily settlement of gains and losses."
      },

      {
        question: "What is convexity bias?",
        answer: "Difference between futures and forward prices due to interest rate volatility."
      },

      {
        question: "What is put-call parity?",
        answer: "Relationship between European call, put, stock, and bond prices."
      },

      {
        question: "What is the binomial model?",
        answer: "A model valuing derivatives using possible up and down price movements."
      }

    ];

    let currentCard = 0;

    const card = document.getElementById("flashcard");
    const question = document.getElementById("question");
    const answer = document.getElementById("answer");
    const counter = document.getElementById("counter");

    card.addEventListener("click", () => {
      card.classList.toggle("flipped");
    });

    function loadCard(){

      question.textContent =
        flashcards[currentCard].question;

      answer.textContent =
        flashcards[currentCard].answer;

      counter.textContent =
        `${currentCard + 1} / ${flashcards.length}`;

      card.classList.remove("flipped");
    }

    function nextCard(){

      currentCard++;

      if(currentCard >= flashcards.length){
        currentCard = 0;
      }

      loadCard();
    }

    function prevCard(){

      currentCard--;

      if(currentCard < 0){
        currentCard = flashcards.length - 1;
      }

      loadCard();
    }

    loadCard();

  </script>

</body>
</html>
