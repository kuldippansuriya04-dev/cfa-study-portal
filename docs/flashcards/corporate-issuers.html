<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Corporate Issuers Flashcards</title>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, Helvetica, sans-serif;
    }

    body{
      background:#f3f4f6;
      display:flex;
      justify-content:center;
      align-items:center;
      height:100vh;
    }

    .flashcard-container{
      width:650px;
      max-width:90%;
    }

    .card{
      width:100%;
      height:360px;
      perspective:1000px;
      cursor:pointer;
    }

    .card-inner{
      position:relative;
      width:100%;
      height:100%;
      transition:transform 0.6s;
      transform-style:preserve-3d;
    }

    .card.flipped .card-inner{
      transform:rotateY(180deg);
    }

    .card-front,
    .card-back{
      position:absolute;
      width:100%;
      height:100%;
      border-radius:24px;
      padding:40px;

      display:flex;
      flex-direction:column;
      justify-content:center;
      align-items:center;
      text-align:center;

      backface-visibility:hidden;

      box-shadow:0 10px 30px rgba(0,0,0,0.08);
    }

    .card-front{
      background:white;
      color:#111827;
    }

    .card-back{
      background:#2563eb;
      color:white;
      transform:rotateY(180deg);
    }

    .tag{
      padding:10px 22px;
      border-radius:30px;
      font-size:14px;
      font-weight:bold;
      margin-bottom:30px;
    }

    .front-tag{
      background:#dbeafe;
      color:#2563eb;
    }

    .back-tag{
      background:white;
      color:#2563eb;
    }

    h2{
      font-size:38px;
      line-height:1.4;
      max-width:90%;
    }

    .hint{
      margin-top:35px;
      font-size:14px;
      opacity:0.7;
    }

    .controls{
      margin-top:35px;
      display:flex;
      justify-content:space-between;
      align-items:center;
    }

    button{
      border:none;
      background:#2563eb;
      color:white;
      padding:16px 28px;
      border-radius:14px;
      cursor:pointer;
      font-size:20px;
      font-weight:600;
      transition:0.2s;
    }

    button:hover{
      background:#1d4ed8;
    }

    .counter{
      font-size:30px;
      font-weight:bold;
      color:#374151;
    }

  </style>

</head>

<body>

  <div class="flashcard-container">

    <div class="card" id="flashcard">

      <div class="card-inner">

        <!-- FRONT -->

        <div class="card-front">

          <div class="tag front-tag">
            QUESTION
          </div>

          <h2 id="question"></h2>

          <div class="hint">
            Click card to flip
          </div>

        </div>

        <!-- BACK -->

        <div class="card-back">

          <div class="tag back-tag">
            ANSWER
          </div>

          <h2 id="answer"></h2>

        </div>

      </div>

    </div>

    <!-- CONTROLS -->

    <div class="controls">

      <button onclick="prevCard()">
        ← Previous
      </button>

      <div class="counter" id="counter">
        1 / 20
      </div>

      <button onclick="nextCard()">
        Next →
      </button>

    </div>

  </div>

  <script>

    const flashcards = [

      {
        question: "What is a sole proprietorship?",
        answer: "Business owned by one individual."
      },

      {
        question: "What is a partnership?",
        answer: "Business jointly owned by multiple individuals."
      },

      {
        question: "What is a corporation?",
        answer: "Separate legal entity owned by shareholders."
      },

      {
        question: "What is limited liability?",
        answer: "Owners are not personally liable beyond investment."
      },

      {
        question: "What is corporate governance?",
        answer: "System used to direct and control a company."
      },

      {
        question: "What are stakeholders?",
        answer: "Groups affected by company decisions."
      },

      {
        question: "What is ESG?",
        answer: "Environmental, social, and governance considerations."
      },

      {
        question: "What is working capital?",
        answer: "Current assets minus current liabilities."
      },

      {
        question: "What is liquidity?",
        answer: "Ability to meet short-term obligations."
      },

      {
        question: "What is the cash conversion cycle?",
        answer: "Time required to convert inventory into cash."
      },

      {
        question: "What is inventory turnover?",
        answer: "Measure of inventory selling efficiency."
      },

      {
        question: "What is receivables turnover?",
        answer: "Measure of receivables collection efficiency."
      },

      {
        question: "What is payables turnover?",
        answer: "Measure of supplier payment speed."
      },

      {
        question: "What is capital budgeting?",
        answer: "Evaluating long-term investment projects."
      },

      {
        question: "What is NPV?",
        answer: "Present value of inflows minus outflows."
      },

      {
        question: "What is IRR?",
        answer: "Discount rate that makes NPV equal zero."
      },

      {
        question: "What is cost of capital?",
        answer: "Required return expected by investors."
      },

      {
        question: "What is cost of debt?",
        answer: "Interest paid on borrowed funds."
      },

      {
        question: "What is cost of equity?",
        answer: "Return required by shareholders."
      },

      {
        question: "What is WACC?",
        answer: "Weighted average cost of capital."
      }

    ];

    let currentCard = 0;

    const card = document.getElementById("flashcard");
    const question = document.getElementById("question");
    const answer = document.getElementById("answer");
    const counter = document.getElementById("counter");

    card.addEventListener("click", () => {
      card.classList.toggle("flipped");
    });

    function loadCard(){

      question.textContent =
        flashcards[currentCard].question;

      answer.textContent =
        flashcards[currentCard].answer;

      counter.textContent =
        `${currentCard + 1} / ${flashcards.length}`;

      card.classList.remove("flipped");
    }

    function nextCard(){

      currentCard++;

      if(currentCard >= flashcards.length){
        currentCard = 0;
      }

      loadCard();
    }

    function prevCard(){

      currentCard--;

      if(currentCard < 0){
        currentCard = flashcards.length - 1;
      }

      loadCard();
    }

    loadCard();

  </script>

</body>
</html>
