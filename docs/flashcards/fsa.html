<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>CFA FSA Flashcards</title>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, Helvetica, sans-serif;
    }

    body{
      background:#f3f4f6;
      min-height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      padding:20px;
    }

    .container{
      width:720px;
      max-width:95%;
    }

    .card{
      width:100%;
      height:400px;
      perspective:1000px;
      cursor:pointer;
    }

    .card-inner{
      width:100%;
      height:100%;
      position:relative;
      transition:transform 0.7s;
      transform-style:preserve-3d;
    }

    .card.flipped .card-inner{
      transform:rotateY(180deg);
    }

    .front,
    .back{
      position:absolute;
      width:100%;
      height:100%;
      border-radius:24px;
      padding:40px;

      display:flex;
      flex-direction:column;
      justify-content:center;
      align-items:center;
      text-align:center;

      backface-visibility:hidden;

      box-shadow:0 10px 30px rgba(0,0,0,0.08);
    }

    .front{
      background:white;
      color:#111827;
    }

    .back{
      background:#0891b2;
      color:white;
      transform:rotateY(180deg);
    }

    h2{
      font-size:32px;
      line-height:1.5;
      max-width:95%;
    }

    .hint{
      margin-top:28px;
      font-size:14px;
      opacity:0.7;
    }

    .controls{
      margin-top:30px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:15px;
      flex-wrap:wrap;
    }

    button{
      border:none;
      background:#0891b2;
      color:white;
      padding:14px 24px;
      border-radius:14px;
      cursor:pointer;
      font-size:18px;
      font-weight:600;
      transition:0.2s;
    }

    button:hover{
      background:#0e7490;
    }

    .counter{
      font-size:28px;
      font-weight:bold;
      color:#374151;
    }

    @media(max-width:600px){

      .card{
        height:460px;
      }

      h2{
        font-size:24px;
      }

      .controls{
        flex-direction:column;
      }

      button{
        width:100%;
      }

      .counter{
        font-size:22px;
      }

    }

  </style>

</head>
<body>

  <div class="container">

    <div class="card" id="card">

      <div class="card-inner">

        <div class="front">

          <h2 id="question"></h2>

          <div class="hint">
            Click card to flip
          </div>

        </div>

        <div class="back">

          <h2 id="answer"></h2>

        </div>

      </div>

    </div>

    <div class="controls">

      <button onclick="prevCard()">
        ← Previous
      </button>

      <div class="counter" id="counter">
        1 / 20
      </div>

      <button onclick="nextCard()">
        Next →
      </button>

    </div>

  </div>

  <script>

    const flashcards = [

      {
        question:"What is Financial Statement Analysis (FSA)?",
        answer:"The process of analyzing financial reports to evaluate a company’s performance and financial position."
      },

      {
        question:"What are the main financial statements?",
        answer:"Income Statement, Balance Sheet, Cash Flow Statement, and Statement of Changes in Equity."
      },

      {
        question:"What is accrual accounting?",
        answer:"Accounting method recognizing revenues and expenses when earned or incurred, not when cash moves."
      },

      {
        question:"What is revenue recognition?",
        answer:"Recording revenue when performance obligations are satisfied."
      },

      {
        question:"What is expense recognition?",
        answer:"Matching expenses with the revenues they help generate."
      },

      {
        question:"What is EPS?",
        answer:"Earnings Per Share — net income available to common shareholders divided by weighted average shares."
      },

      {
        question:"What is comprehensive income?",
        answer:"Total change in equity from non-owner sources."
      },

      {
        question:"What is a common-size income statement?",
        answer:"An income statement where each item is expressed as a percentage of revenue."
      },

      {
        question:"What is a balance sheet?",
        answer:"A financial statement showing assets, liabilities, and equity at a point in time."
      },

      {
        question:"What is working capital?",
        answer:"Current assets minus current liabilities."
      },

      {
        question:"What is shareholders’ equity?",
        answer:"Residual interest in assets after deducting liabilities."
      },

      {
        question:"What is operating cash flow (CFO)?",
        answer:"Cash generated from core business operations."
      },

      {
        question:"What is free cash flow?",
        answer:"Cash available after capital expenditures."
      },

      {
        question:"What is inventory turnover?",
        answer:"Ratio measuring how quickly inventory is sold and replaced."
      },

      {
        question:"What is FIFO inventory method?",
        answer:"First-In First-Out assumes oldest inventory is sold first."
      },

      {
        question:"What is LIFO reserve?",
        answer:"Difference between inventory under FIFO and LIFO methods."
      },

      {
        question:"What is depreciation?",
        answer:"Allocation of the cost of tangible assets over useful life."
      },

      {
        question:"What is amortization?",
        answer:"Allocation of the cost of intangible assets over useful life."
      },

      {
        question:"What is deferred tax liability?",
        answer:"Taxes owed in future periods due to temporary accounting differences."
      },

      {
        question:"What is DuPont Analysis?",
        answer:"A framework decomposing ROE into profitability, efficiency, and leverage components."
      }

    ];

    let currentCard = 0;

    const card = document.getElementById("card");
    const question = document.getElementById("question");
    const answer = document.getElementById("answer");
    const counter = document.getElementById("counter");

    card.addEventListener("click", () => {
      card.classList.toggle("flipped");
    });

    function loadCard(){

      question.textContent =
        flashcards[currentCard].question;

      answer.textContent =
        flashcards[currentCard].answer;

      counter.textContent =
        `${currentCard + 1} / ${flashcards.length}`;

      card.classList.remove("flipped");
    }

    function nextCard(){

      currentCard++;

      if(currentCard >= flashcards.length){
        currentCard = 0;
      }

      loadCard();
    }

    function prevCard(){

      currentCard--;

      if(currentCard < 0){
        currentCard = flashcards.length - 1;
      }

      loadCard();
    }

    loadCard();

  </script>

</body>
</html>
