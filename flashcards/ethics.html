<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>CFA Ethics Flashcards</title>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, Helvetica, sans-serif;
    }

    body{
      background:#f3f4f6;
      min-height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      padding:20px;
    }

    .container{
      width:720px;
      max-width:95%;
    }

    .card{
      width:100%;
      height:400px;
      perspective:1000px;
      cursor:pointer;
    }

    .card-inner{
      width:100%;
      height:100%;
      position:relative;
      transition:transform 0.7s;
      transform-style:preserve-3d;
    }

    .card.flipped .card-inner{
      transform:rotateY(180deg);
    }

    .front,
    .back{
      position:absolute;
      width:100%;
      height:100%;
      border-radius:24px;
      padding:40px;

      display:flex;
      flex-direction:column;
      justify-content:center;
      align-items:center;
      text-align:center;

      backface-visibility:hidden;

      box-shadow:0 10px 30px rgba(0,0,0,0.08);
    }

    .front{
      background:white;
      color:#111827;
    }

    .back{
      background:#dc2626;
      color:white;
      transform:rotateY(180deg);
    }

    .badge{
      padding:10px 24px;
      border-radius:999px;
      font-size:14px;
      font-weight:bold;
      margin-bottom:28px;
    }

    .front-badge{
      background:#fee2e2;
      color:#dc2626;
    }

    .back-badge{
      background:white;
      color:#dc2626;
    }

    h2{
      font-size:32px;
      line-height:1.5;
      max-width:95%;
    }

    .hint{
      margin-top:28px;
      font-size:14px;
      opacity:0.7;
    }

    .controls{
      margin-top:30px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:15px;
      flex-wrap:wrap;
    }

    button{
      border:none;
      background:#dc2626;
      color:white;
      padding:14px 24px;
      border-radius:14px;
      cursor:pointer;
      font-size:18px;
      font-weight:600;
      transition:0.2s;
    }

    button:hover{
      background:#b91c1c;
    }

    .counter{
      font-size:28px;
      font-weight:bold;
      color:#374151;
    }

    @media(max-width:600px){

      .card{
        height:450px;
      }

      h2{
        font-size:24px;
      }

      .controls{
        flex-direction:column;
      }

      button{
        width:100%;
      }

      .counter{
        font-size:22px;
      }

    }

  </style>

</head>
<body>

  <div class="container">

    <div class="card" id="card">

      <div class="card-inner">

        <div class="front">

          <div class="badge front-badge">
            ETHICS QUESTION
          </div>

          <h2 id="question"></h2>

          <div class="hint">
            Click card to flip
          </div>

        </div>

        <div class="back">

          <div class="badge back-badge">
            ANSWER
          </div>

          <h2 id="answer"></h2>

        </div>

      </div>

    </div>

    <div class="controls">

      <button onclick="prevCard()">
        ← Previous
      </button>

      <div class="counter" id="counter">
        1 / 20
      </div>

      <button onclick="nextCard()">
        Next →
      </button>

    </div>

  </div>

  <script>

    const flashcards = [

      {
        question:"What is ethics?",
        answer:"A set of moral principles guiding behavior and decision-making."
      },

      {
        question:"Why is trust important in investment profession?",
        answer:"Trust builds confidence in financial markets and investment professionals."
      },

      {
        question:"What is the CFA Code of Ethics?",
        answer:"Principles that guide ethical and professional conduct for CFA members."
      },

      {
        question:"What is professionalism?",
        answer:"Maintaining integrity, competence, and ethical behavior in work."
      },

      {
        question:"What is integrity of capital markets?",
        answer:"Fairness and transparency in financial markets."
      },

      {
        question:"What is material nonpublic information?",
        answer:"Important confidential information not available to the public."
      },

      {
        question:"What is misconduct?",
        answer:"Dishonest or unethical professional behavior."
      },

      {
        question:"What is loyalty to clients?",
        answer:"Placing client interests above personal or employer interests."
      },

      {
        question:"What is suitability?",
        answer:"Making investment recommendations appropriate for a client’s objectives."
      },

      {
        question:"What is fair dealing?",
        answer:"Treating all clients fairly when providing investment recommendations."
      },

      {
        question:"What is diligence and reasonable basis?",
        answer:"Using thorough research and analysis before making recommendations."
      },

      {
        question:"What is conflict of interest?",
        answer:"A situation where personal interests may affect professional judgment."
      },

      {
        question:"What is disclosure?",
        answer:"Providing clear and complete information to clients and employers."
      },

      {
        question:"What are referral fees?",
        answer:"Compensation received for recommending products or services."
      },

      {
        question:"What is confidentiality?",
        answer:"Protecting client information unless disclosure is legally required."
      },

      {
        question:"What are employer responsibilities?",
        answer:"Duties employees owe to their employers including loyalty and compliance."
      },

      {
        question:"What is GIPS?",
        answer:"Global Investment Performance Standards for fair investment performance reporting."
      },

      {
        question:"Why were GIPS standards created?",
        answer:"To improve transparency and comparability of investment performance."
      },

      {
        question:"What is a composite in GIPS?",
        answer:"A grouping of portfolios managed with a similar investment strategy."
      },

      {
        question:"What is verification in GIPS?",
        answer:"Independent review confirming compliance with GIPS standards."
      }

    ];

    let currentCard = 0;

    const card = document.getElementById("card");
    const question = document.getElementById("question");
    const answer = document.getElementById("answer");
    const counter = document.getElementById("counter");

    card.addEventListener("click", () => {
      card.classList.toggle("flipped");
    });

    function loadCard(){

      question.textContent =
        flashcards[currentCard].question;

      answer.textContent =
        flashcards[currentCard].answer;

      counter.textContent =
        `${currentCard + 1} / ${flashcards.length}`;

      card.classList.remove("flipped");
    }

    function nextCard(){

      currentCard++;

      if(currentCard >= flashcards.length){
        currentCard = 0;
      }

      loadCard();
    }

    function prevCard(){

      currentCard--;

      if(currentCard < 0){
        currentCard = flashcards.length - 1;
      }

      loadCard();
    }

    loadCard();

  </script>

</body>
</html>
