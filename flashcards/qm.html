<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>CFA Quantitative Methods Flashcards</title>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, Helvetica, sans-serif;
    }

    body{
      background:#f3f4f6;
      min-height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      padding:20px;
    }

    .container{
      width:720px;
      max-width:95%;
    }

    .card{
      width:100%;
      height:400px;
      perspective:1000px;
      cursor:pointer;
    }

    .card-inner{
      width:100%;
      height:100%;
      position:relative;
      transition:transform 0.7s;
      transform-style:preserve-3d;
    }

    .card.flipped .card-inner{
      transform:rotateY(180deg);
    }

    .front,
    .back{
      position:absolute;
      width:100%;
      height:100%;
      border-radius:24px;
      padding:40px;

      display:flex;
      flex-direction:column;
      justify-content:center;
      align-items:center;
      text-align:center;

      backface-visibility:hidden;

      box-shadow:0 10px 30px rgba(0,0,0,0.08);
    }

    .front{
      background:white;
      color:#111827;
    }

    .back{
      background:#0284c7;
      color:white;
      transform:rotateY(180deg);
    }

    h2{
      font-size:32px;
      line-height:1.5;
      max-width:95%;
    }

    .hint{
      margin-top:28px;
      font-size:14px;
      opacity:0.7;
    }

    .controls{
      margin-top:30px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:15px;
      flex-wrap:wrap;
    }

    button{
      border:none;
      background:#0284c7;
      color:white;
      padding:14px 24px;
      border-radius:14px;
      cursor:pointer;
      font-size:18px;
      font-weight:600;
      transition:0.2s;
    }

    button:hover{
      background:#0369a1;
    }

    .counter{
      font-size:28px;
      font-weight:bold;
      color:#374151;
    }

    @media(max-width:600px){

      .card{
        height:470px;
      }

      h2{
        font-size:24px;
      }

      .controls{
        flex-direction:column;
      }

      button{
        width:100%;
      }

      .counter{
        font-size:22px;
      }

    }

  </style>

</head>
<body>

  <div class="container">

    <div class="card" id="card">

      <div class="card-inner">

        <div class="front">

          <h2 id="question"></h2>

          <div class="hint">
            Click card to flip
          </div>

        </div>

        <div class="back">

          <h2 id="answer"></h2>

        </div>

      </div>

    </div>

    <div class="controls">

      <button onclick="prevCard()">
        ← Previous
      </button>

      <div class="counter" id="counter">
        1 / 20
      </div>

      <button onclick="nextCard()">
        Next →
      </button>

    </div>

  </div>

  <script>

    const flashcards = [

      {
        question:"What is Bayes’ Theorem?",
        answer:"A formula used to update probability based on new information."
      },

      {
        question:"What is conditional probability?",
        answer:"Probability of an event occurring given another event has occurred."
      },

      {
        question:"What is joint probability?",
        answer:"Probability of two events occurring together."
      },

      {
        question:"What is portfolio expected return?",
        answer:"Weighted average of expected returns of assets in the portfolio."
      },

      {
        question:"What is covariance?",
        answer:"A measure showing how two variables move together."
      },

      {
        question:"What is correlation?",
        answer:"Standardized measure of relationship between two variables."
      },

      {
        question:"What is portfolio variance?",
        answer:"Measure of total portfolio risk considering covariance between assets."
      },

      {
        question:"What is Mean-Variance Analysis?",
        answer:"Process of balancing expected return against investment risk."
      },

      {
        question:"What is Roy’s Safety First Ratio?",
        answer:"Measure used to minimize probability of returns falling below a target."
      },

      {
        question:"What is shortfall risk?",
        answer:"Probability of earning less than a minimum acceptable return."
      },

      {
        question:"What is Value at Risk (VaR)?",
        answer:"Estimated minimum loss over a period at a specified confidence level."
      },

      {
        question:"What is stress testing?",
        answer:"Analyzing portfolio performance under extreme unfavorable scenarios."
      },

      {
        question:"What is log-normal distribution?",
        answer:"A distribution where logarithm of values is normally distributed."
      },

      {
        question:"What is Monte Carlo Simulation?",
        answer:"A method using repeated random sampling to estimate possible outcomes."
      },

      {
        question:"What is bootstrapping?",
        answer:"A resampling technique using repeated samples from existing data."
      },

      {
        question:"What is sampling error?",
        answer:"Difference between sample statistic and actual population parameter."
      },

      {
        question:"What is Central Limit Theorem?",
        answer:"Large sample means tend to follow a normal distribution."
      },

      {
        question:"What is Type I Error?",
        answer:"Rejecting a true null hypothesis."
      },

      {
        question:"What is Type II Error?",
        answer:"Failing to reject a false null hypothesis."
      },

      {
        question:"What is hypothesis testing?",
        answer:"Statistical process used to evaluate claims about population parameters."
      }

    ];

    let currentCard = 0;

    const card = document.getElementById("card");
    const question = document.getElementById("question");
    const answer = document.getElementById("answer");
    const counter = document.getElementById("counter");

    card.addEventListener("click", () => {
      card.classList.toggle("flipped");
    });

    function loadCard(){

      question.textContent =
        flashcards[currentCard].question;

      answer.textContent =
        flashcards[currentCard].answer;

      counter.textContent =
        `${currentCard + 1} / ${flashcards.length}`;

      card.classList.remove("flipped");
    }

    function nextCard(){

      currentCard++;

      if(currentCard >= flashcards.length){
        currentCard = 0;
      }

      loadCard();
    }

    function prevCard(){

      currentCard--;

      if(currentCard < 0){
        currentCard = flashcards.length - 1;
      }

      loadCard();
    }

    loadCard();

  </script>

</body>
</html>
