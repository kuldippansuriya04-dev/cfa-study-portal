<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>CFA Fixed Income Flashcards</title>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, Helvetica, sans-serif;
    }

    body{
      background:#f3f4f6;
      min-height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      padding:20px;
    }

    .container{
      width:720px;
      max-width:95%;
    }

    .card{
      width:100%;
      height:400px;
      perspective:1000px;
      cursor:pointer;
    }

    .card-inner{
      width:100%;
      height:100%;
      position:relative;
      transition:transform 0.7s;
      transform-style:preserve-3d;
    }

    .card.flipped .card-inner{
      transform:rotateY(180deg);
    }

    .front,
    .back{
      position:absolute;
      width:100%;
      height:100%;
      border-radius:24px;
      padding:40px;

      display:flex;
      flex-direction:column;
      justify-content:center;
      align-items:center;
      text-align:center;

      backface-visibility:hidden;

      box-shadow:0 10px 30px rgba(0,0,0,0.08);
    }

    .front{
      background:white;
      color:#111827;
    }

    .back{
      background:#ea580c;
      color:white;
      transform:rotateY(180deg);
    }

    h2{
      font-size:32px;
      line-height:1.5;
      max-width:95%;
    }

    .hint{
      margin-top:28px;
      font-size:14px;
      opacity:0.7;
    }

    .controls{
      margin-top:30px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:15px;
      flex-wrap:wrap;
    }

    button{
      border:none;
      background:#ea580c;
      color:white;
      padding:14px 24px;
      border-radius:14px;
      cursor:pointer;
      font-size:18px;
      font-weight:600;
      transition:0.2s;
    }

    button:hover{
      background:#c2410c;
    }

    .counter{
      font-size:28px;
      font-weight:bold;
      color:#374151;
    }

    @media(max-width:600px){

      .card{
        height:460px;
      }

      h2{
        font-size:24px;
      }

      .controls{
        flex-direction:column;
      }

      button{
        width:100%;
      }

      .counter{
        font-size:22px;
      }

    }

  </style>

</head>
<body>

  <div class="container">

    <div class="card" id="card">

      <div class="card-inner">

        <div class="front">

          <h2 id="question"></h2>

          <div class="hint">
            Click card to flip
          </div>

        </div>

        <div class="back">

          <h2 id="answer"></h2>

        </div>

      </div>

    </div>

    <div class="controls">

      <button onclick="prevCard()">
        ← Previous
      </button>

      <div class="counter" id="counter">
        1 / 20
      </div>

      <button onclick="nextCard()">
        Next →
      </button>

    </div>

  </div>

  <script>

    const flashcards = [

      {
        question:"What is a bond?",
        answer:"A fixed-income instrument representing a loan made by an investor to a borrower."
      },

      {
        question:"What is par value?",
        answer:"The face value paid by the issuer at maturity."
      },

      {
        question:"What is coupon rate?",
        answer:"The interest rate paid on a bond based on face value."
      },

      {
        question:"What is Yield to Maturity (YTM)?",
        answer:"The total expected return if the bond is held until maturity."
      },

      {
        question:"What is accrued interest?",
        answer:"Interest earned but not yet paid since the last coupon payment."
      },

      {
        question:"What is dirty price?",
        answer:"Full price of bond including accrued interest."
      },

      {
        question:"What is clean price?",
        answer:"Bond price excluding accrued interest."
      },

      {
        question:"What is a repo agreement?",
        answer:"Sale of a security with agreement to repurchase later at a higher price."
      },

      {
        question:"What is haircut in repo?",
        answer:"Difference between collateral value and loan amount."
      },

      {
        question:"What is variation margin?",
        answer:"Additional collateral required when collateral value changes."
      },

      {
        question:"What is commercial paper?",
        answer:"Short-term unsecured debt issued by highly rated companies."
      },

      {
        question:"What is rollover risk?",
        answer:"Risk of inability to refinance maturing short-term debt."
      },

      {
        question:"What are on-the-run securities?",
        answer:"Most recently issued and most liquid government securities."
      },

      {
        question:"What are off-the-run securities?",
        answer:"Older government securities traded less frequently."
      },

      {
        question:"What is convexity effect?",
        answer:"Bond price increases more when yields fall than decreases when yields rise."
      },

      {
        question:"What is matrix pricing?",
        answer:"Estimating bond value using comparable actively traded bonds."
      },

      {
        question:"What is current yield?",
        answer:"Annual coupon divided by the bond’s current clean price."
      },

      {
        question:"What is yield spread?",
        answer:"Difference between bond yield and benchmark yield."
      },

      {
        question:"What is G-Spread?",
        answer:"Spread over a government bond yield benchmark."
      },

      {
        question:"What is floating-rate note (FRN)?",
        answer:"A bond whose coupon changes based on a reference interest rate."
      }

    ];

    let currentCard = 0;

    const card = document.getElementById("card");
    const question = document.getElementById("question");
    const answer = document.getElementById("answer");
    const counter = document.getElementById("counter");

    card.addEventListener("click", () => {
      card.classList.toggle("flipped");
    });

    function loadCard(){

      question.textContent =
        flashcards[currentCard].question;

      answer.textContent =
        flashcards[currentCard].answer;

      counter.textContent =
        `${currentCard + 1} / ${flashcards.length}`;

      card.classList.remove("flipped");
    }

    function nextCard(){

      currentCard++;

      if(currentCard >= flashcards.length){
        currentCard = 0;
      }

      loadCard();
    }

    function prevCard(){

      currentCard--;

      if(currentCard < 0){
        currentCard = flashcards.length - 1;
      }

      loadCard();
    }

    loadCard();

  </script>

</body>
</html>
