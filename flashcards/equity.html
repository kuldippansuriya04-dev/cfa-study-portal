<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>CFA Equity Flashcards</title>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, Helvetica, sans-serif;
    }

    body{
      background:#f3f4f6;
      min-height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      padding:20px;
    }

    .container{
      width:720px;
      max-width:95%;
    }

    .card{
      width:100%;
      height:400px;
      perspective:1000px;
      cursor:pointer;
    }

    .card-inner{
      width:100%;
      height:100%;
      position:relative;
      transition:transform 0.7s;
      transform-style:preserve-3d;
    }

    .card.flipped .card-inner{
      transform:rotateY(180deg);
    }

    .front,
    .back{
      position:absolute;
      width:100%;
      height:100%;
      border-radius:24px;
      padding:40px;

      display:flex;
      flex-direction:column;
      justify-content:center;
      align-items:center;
      text-align:center;

      backface-visibility:hidden;

      box-shadow:0 10px 30px rgba(0,0,0,0.08);
    }

    .front{
      background:white;
      color:#111827;
    }

    .back{
      background:#7c3aed;
      color:white;
      transform:rotateY(180deg);
    }

    .badge{
      padding:10px 24px;
      border-radius:999px;
      font-size:14px;
      font-weight:bold;
      margin-bottom:28px;
    }

    .front-badge{
      background:#ede9fe;
      color:#7c3aed;
    }

    .back-badge{
      background:white;
      color:#7c3aed;
    }

    h2{
      font-size:32px;
      line-height:1.5;
      max-width:95%;
    }

    .hint{
      margin-top:28px;
      font-size:14px;
      opacity:0.7;
    }

    .controls{
      margin-top:30px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:15px;
      flex-wrap:wrap;
    }

    button{
      border:none;
      background:#7c3aed;
      color:white;
      padding:14px 24px;
      border-radius:14px;
      cursor:pointer;
      font-size:18px;
      font-weight:600;
      transition:0.2s;
    }

    button:hover{
      background:#6d28d9;
    }

    .counter{
      font-size:28px;
      font-weight:bold;
      color:#374151;
    }

    @media(max-width:600px){

      .card{
        height:450px;
      }

      h2{
        font-size:24px;
      }

      .controls{
        flex-direction:column;
      }

      button{
        width:100%;
      }

      .counter{
        font-size:22px;
      }

    }

  </style>

</head>
<body>

  <div class="container">

    <div class="card" id="card">

      <div class="card-inner">

        <div class="front">

          <div class="badge front-badge">
            EQUITY QUESTION
          </div>

          <h2 id="question"></h2>

          <div class="hint">
            Click card to flip
          </div>

        </div>

        <div class="back">

          <div class="badge back-badge">
            ANSWER
          </div>

          <h2 id="answer"></h2>

        </div>

      </div>

    </div>

    <div class="controls">

      <button onclick="prevCard()">
        ← Previous
      </button>

      <div class="counter" id="counter">
        1 / 20
      </div>

      <button onclick="nextCard()">
        Next →
      </button>

    </div>

  </div>

  <script>

    const flashcards = [

      {
        question:"What is a financial system?",
        answer:"A system that allows transfer of funds between savers and borrowers."
      },

      {
        question:"What are primary markets?",
        answer:"Markets where new securities are issued for the first time."
      },

      {
        question:"What are secondary markets?",
        answer:"Markets where existing securities are traded among investors."
      },

      {
        question:"What is leverage?",
        answer:"Using borrowed money to increase potential returns."
      },

      {
        question:"What is a short position?",
        answer:"Selling borrowed securities expecting prices to fall."
      },

      {
        question:"What is a market index?",
        answer:"A portfolio representing performance of a market segment."
      },

      {
        question:"What is total return index?",
        answer:"An index including both price changes and reinvested dividends."
      },

      {
        question:"What is market efficiency?",
        answer:"A market where prices fully reflect available information."
      },

      {
        question:"What is intrinsic value?",
        answer:"The true estimated value of a security."
      },

      {
        question:"What is behavioral finance?",
        answer:"Study of psychological influences on investor decisions."
      },

      {
        question:"What are equity securities?",
        answer:"Securities representing ownership in a company."
      },

      {
        question:"What is preferred stock?",
        answer:"A class of stock with fixed dividends and priority claims."
      },

      {
        question:"What is ROE?",
        answer:"Return on Equity — profit earned relative to shareholder equity."
      },

      {
        question:"What is pricing power?",
        answer:"Ability of a company to raise prices without losing customers."
      },

      {
        question:"What is operating leverage?",
        answer:"Impact of fixed costs on profitability changes."
      },

      {
        question:"What is working capital?",
        answer:"Current assets minus current liabilities."
      },

      {
        question:"What is Porter’s Five Forces?",
        answer:"Framework analyzing industry competition and profitability."
      },

      {
        question:"What is PESTLE analysis?",
        answer:"Analysis of Political, Economic, Social, Technological, Legal, and Environmental factors."
      },

      {
        question:"What is Dividend Discount Model (DDM)?",
        answer:"A valuation model based on present value of future dividends."
      },

      {
        question:"What is Gordon Growth Model?",
        answer:"A constant-growth dividend valuation model."
      }

    ];

    let currentCard = 0;

    const card = document.getElementById("card");
    const question = document.getElementById("question");
    const answer = document.getElementById("answer");
    const counter = document.getElementById("counter");

    card.addEventListener("click", () => {
      card.classList.toggle("flipped");
    });

    function loadCard(){

      question.textContent =
        flashcards[currentCard].question;

      answer.textContent =
        flashcards[currentCard].answer;

      counter.textContent =
        `${currentCard + 1} / ${flashcards.length}`;

      card.classList.remove("flipped");
    }

    function nextCard(){

      currentCard++;

      if(currentCard >= flashcards.length){
        currentCard = 0;
      }

      loadCard();
    }

    function prevCard(){

      currentCard--;

      if(currentCard < 0){
        currentCard = flashcards.length - 1;
      }

      loadCard();
    }

    loadCard();

  </script>

</body>
</html>
